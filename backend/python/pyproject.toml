[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowflow"
version = "0.3.0"
description = "Multi-agent workflow orchestration with pluggable checkpoint stores (Memory / File / SQLite)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ravenveil"}
]
keywords = ["multi-agent", "orchestration", "ai", "workflow", "checkpoint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
# 核心依赖：只装这些就能跑 shadowflow run / ask / status
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.26.0",     # CLI / HTTP 执行器客户端
]

[project.optional-dependencies]
# pip install shadowflow[server]  — REST API server (shadowflow server)
server = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "watchfiles>=0.21.0",  # uvicorn --reload 的文件监视后端；缺失时热载静默失效（2026-11-08 踩坑）
    "APScheduler>=3.10,<4",  # Story 14-2: schedule drawer
    "slowapi>=0.1.9",        # rate limiting
    "python-multipart>=0.0.9",  # FastAPI Form/File 端点注册时强校验，缺失则 uvicorn 启动即崩
    "numpy>=1.24",           # 记忆库向量检索（memory_bank._dense_rankings），缺失时混合检索 500
]
# pip install shadowflow[memory]  — Redis / SQLite 持久化
memory = [
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
]
# pip install shadowflow[mcp]  — MCP client support (Story 2.4)
mcp = [
    "mcp>=1.0",
]
# pip install shadowflow[mcp-servers]  — MCP server 工具集（shell / fs / web）
mcp-servers = [
    "mcp>=1.0",
    "paramiko>=3.0",
    "html2text>=2024.0",
]
# pip install shadowflow[lightrag]  — LightRAG 可选 RAG 后端（本地文件，无需外部 DB）
# 需同时在 .env 中设置 LIGHTRAG_ENABLED=true 及对应 API keys
lightrag = [
    "lightrag-hku>=1.3.9",
]
# pip install shadowflow[all]  — 全功能
all = [
    "httpx>=0.26.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "watchfiles>=0.21.0",
    "APScheduler>=3.10,<4",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    "mcp>=1.0",
    "paramiko>=3.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/Ravenveil/ShadowFlow"
Repository = "https://github.com/Ravenveil/ShadowFlow"
"Bug Tracker" = "https://github.com/Ravenveil/ShadowFlow/issues"

[project.scripts]
shadowflow = "shadowflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadowflow*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# MVP baseline: pyflakes (F) catches real bugs (unused imports, undefined names).
# Style rules (E/W/I/N) intentionally deferred — 535 pre-existing findings in the
# brownfield code; tighten in a later story once the hackathon MVP lands.
select = ["F"]
# F401/F403/F405: re-export patterns. F821: forward-ref strings with `# type: ignore`.
# F841/F541: minor style, not correctness. Tighten in a later story.
ignore = ["F401", "F403", "F405", "F821", "F841", "F541"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "asyncio: marks async-style tests in the legacy suite",
    "legacy: marks tests that exercise historical ShadowFlow APIs outside the Phase 1 contract baseline",
]

