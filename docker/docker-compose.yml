# Story 0.1 — ShadowFlow one-shot orchestration.
# From the repo root run:
#   cp .env.example .env && docker compose -f docker/docker-compose.yml up -d
# to bring up the full MVP.
#
# Service map (2026-11-24 单后端，ADR-0001：Python 服务已退役):
#   shadowflow-node : Node.js 网关（全部业务域 + run-sessions/cli/acp）:8002
#   shadowflow-web  : Vite-built static frontend                            :3000

services:
  shadowflow-node:
    build:
      context: ../backend/node
      dockerfile: Dockerfile
    image: shadowflow/node:dev
    container_name: shadowflow-node
    ports:
      - "8002:8002"
    environment:
      NODE_ENV: development
      PORT: "8002"
    volumes:
      - ../backend/node:/app
      - /app/node_modules            # prevent host node_modules from clobbering image-installed deps
      - shadowflow_node_data:/app/.shadowflow  # persist SQLite + projects/
    networks:
      - shadowflow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  shadowflow-web:
    build:
      context: ..
      # 换新前端（论文四栏工作台）：把下一行改成 docker/Dockerfile.paper，
      # 端口 / 反代 / 依赖关系全都不用动。
      dockerfile: docker/Dockerfile.web
    image: shadowflow/web:dev
    container_name: shadowflow-web
    ports:
      - "3000:3000"
    depends_on:
      shadowflow-node:
        condition: service_healthy
    networks:
      - shadowflow-net
    restart: unless-stopped

networks:
  shadowflow-net:
    driver: bridge

volumes:
  shadowflow_node_data:
