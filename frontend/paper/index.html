<!doctype html>
<html lang="zh-CN" data-theme="ink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowFlow · 论文平台</title>
    <script>
      // 首屏前恢复主题，避免闪白
      try {
        var t = localStorage.getItem('sf-paper-theme');
        if (t === 'ink' || t === 'clean' || t === 'night') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
