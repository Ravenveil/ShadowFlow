<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShadowFlow 服务台</title>
<style>
  :root{--ink:#10161c;--sub:#5c6773;--mut:#8b95a1;--line:#e5e9ee;--brand:#0f7b6c;--bg:#f5f6f8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:940px;margin:0 auto;padding:28px 20px 48px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .logo{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;
    color:#fff;font-size:14px;font-weight:600}
  .brand{font-size:15px;font-weight:600}
  .brand span{color:var(--mut);font-weight:400;margin-left:6px}
  .lead{color:var(--sub);font-size:13.5px;margin:0 0 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:16px}
  .info{flex:1;min-width:0}
  .name{font-size:15px;font-weight:600;margin:0 0 4px}
  .sum{font-size:12.5px;color:var(--sub);margin:0 0 12px;height:36px;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .price{font-size:22px;font-weight:600;letter-spacing:-.5px}
  .price small{font-size:12px;font-weight:400;color:var(--mut);margin-left:3px}
  .eta{font-size:11.5px;color:var(--mut);margin-top:2px}
  .qr{flex:none;text-align:center}
  .qr img{width:104px;height:104px;display:block;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
  .qr span{display:block;font-size:10.5px;color:var(--mut);margin-top:5px}
  .open{display:inline-block;margin-top:10px;font-size:12.5px;color:var(--brand);text-decoration:none}
  .open:hover{text-decoration:underline}
  .foot{margin-top:24px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;
    font-size:12.5px;color:var(--sub);line-height:1.7}
  .foot b{color:var(--ink);font-weight:500}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:#e8f4f1;color:var(--brand);margin-left:6px;vertical-align:1px}
  .err{background:#fceceb;color:#c0392b;padding:12px 14px;border-radius:12px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">S</div><div class="brand">ShadowFlow<span>服务台</span></div></header>
  <p class="lead">扫码即可下单，付款后 Agent 团队自动开工，完成后原地交付。</p>
  <div id="grid" class="grid"><div class="card" style="grid-column:1/-1;color:#8b95a1">加载中…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = c => '¥' + (c / 100).toFixed(2).replace(/\.00$/, '');

(async () => {
  try {
    const res = await fetch('/api/products');
    const data = await res.json();
    const pay = data.pay || {};
    if (!data.items.length) { $('#grid').innerHTML = '<div class="card" style="grid-column:1/-1">还没有上架的服务</div>'; return; }
    $('#grid').innerHTML = data.items.map(p => `
      <div class="card">
        <div class="info">
          <h3 class="name">${esc(p.name)}</h3>
          <p class="sum">${esc(p.summary || '')}</p>
          <div class="price">${money(p.price_cents)}<small>/ 次</small></div>
          <div class="eta">${esc(p.eta_hint || '')}</div>
          <a class="open" href="/q/${esc(p.id)}">在电脑上直接下单 →</a>
        </div>
        <div class="qr">
          <img src="/api/qr?text=${encodeURIComponent(p.landing_url || '')}&scale=4" alt="扫码下单" />
          <span>手机扫码</span>
        </div>
      </div>`).join('');
    $('#foot').innerHTML = pay.real_money
      ? `<b>支付状态</b>　已接入真实网关（${esc(pay.mode)}），下单为真实扣款。`
      : `<b>支付状态</b>　本地沙箱（${esc(pay.mode)}）<span class="tag">不扣真实款项</span>　
         真实收款需要商户号（企业资质）；网关已预留，配置后改一个环境变量即可切换，订单与交付流程不变。<br />
         <b>手机扫码提示</b>　手机需与本机处于同一 WiFi，且服务以 <code>SF_HOST=0.0.0.0</code> 启动；
         当前二维码地址为 ${esc(data.base_url || '')}。`;
  } catch (e) {
    $('#grid').innerHTML = '<div class="err">加载失败：' + esc(e.message) + '</div>';
  }
})();
</script>
</body>
</html>
