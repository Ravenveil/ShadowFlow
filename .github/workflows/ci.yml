# ShadowFlow — CI pipeline
# Gates: lint + typecheck + test + docker build on every PR and push to main.
# NFR S1 red line: never print secrets to logs.
#
# 2026-11-05: backend moved to Node/TS (server/). The old Python gates
# (ruff / mypy / pytest / contracts.py drift check) no longer describe the
# running backend — they failed on every PR and on main itself, so the
# signal was worthless. They are replaced by tsc + vitest for server/.
# The legacy Python package is still built by Dockerfile.api (see
# build (docker)), so packaging regressions are still caught.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same PR / branch when new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sanitize: never let real keys leak into CI logs (NFR S1).
  CI: "true"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

jobs:
  # ------------------------------------------------------------------
  # Lint — eslint spans frontend/src + backend/node/src + tests (config
  # and plugin stack live at repo root; see .eslintrc.cjs).
  # ------------------------------------------------------------------
  lint:
    name: lint (eslint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/node/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

  # ------------------------------------------------------------------
  # Backend typecheck — tsc --noEmit over backend/node/src (no emit, no dist)
  # ------------------------------------------------------------------
  typecheck-backend:
    name: typecheck (backend/node)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/node/package-lock.json

      - name: Install npm dependencies (backend/node)
        # 自包含：vitest / supertest 已是 backend/node 的开发依赖（repo 拆分后
        # 不再借用根 node_modules），单装即可过 tsc --noEmit。
        run: cd backend/node && npm ci

      - name: tsc --noEmit
        run: cd backend/node && npx tsc --noEmit

  # ------------------------------------------------------------------
  # Backend tests — vitest over backend/node/src/__tests__ (real Express
  # routers, temp cwd)
  # ------------------------------------------------------------------
  test-backend:
    name: test (backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/node/package-lock.json

      - name: Install npm dependencies (backend/node)
        run: cd backend/node && npm ci

      - name: vitest (src/__tests__)
        run: cd backend/node && npx vitest run src/__tests__

  # ------------------------------------------------------------------
  # Frontend tests — vitest project "web" (jsdom)
  # ------------------------------------------------------------------
  test-frontend:
    name: test (frontend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/node/package-lock.json

      - name: Install npm dependencies (frontend)
        run: cd frontend && npm ci

      - name: vitest (web project)
        # 固定 2 个 worker：32 核机器上默认会起十几个 worker，transform 抢 IO 时
        # React.lazy 的 chunk 偶发加载失败，表现为「本机绿、CI 红」的随机假失败。
        # CI runner 本来就只有 2 核，这个值和线上行为一致。
        run: cd frontend && npx vitest run --project web --maxWorkers=2

  # ------------------------------------------------------------------
  # Frontend E2E — Playwright route smoke (catches ErrorBoundary crashes)
  # Pinned to ubuntu-24.04: the Playwright build we ship does not support
  # chromium on ubuntu 26.04 runners yet ("Playwright does not support
  # chromium on ubuntu26.04-x64").
  # ------------------------------------------------------------------
  e2e-frontend:
    name: e2e (frontend smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/node/package-lock.json

      - name: Install npm dependencies (root + frontend + backend/node)
        # webServer 用 `npm --prefix .. run dev` 拉起统一启动器（scripts/dev.mjs），
        # 它会 spawn backend/node 的 tsx 网关与 frontend 的 vite：
        # express / better-sqlite3 在 backend/node/node_modules，
        # vite / @playwright/test 在 frontend/node_modules，三边都要装。
        run: |
          npm ci
          cd frontend && npm ci
          cd ../backend/node && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run route smoke tests
        run: cd frontend && npx playwright test tests/e2e/route-smoke.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ------------------------------------------------------------------
  # Docker image build verification — do not push, only prove builds
  # Dockerfile.api still packages the legacy Python service; building it
  # keeps that path honest without gating on pip-level lint/tests.
  # ------------------------------------------------------------------
  build-docker:
    name: build (docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, typecheck-backend, test-backend, test-frontend, e2e-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dockerfile.api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: false
          load: false
          tags: shadowflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Dockerfile.web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.web
          push: false
          load: false
          tags: shadowflow-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ------------------------------------------------------------------
  # Secret scanning — catch key leaks on every PR and push to main (NFR S1)
  # GitHub's built-in secret scanning runs automatically on public repos.
  # This job adds TruffleHog for commit-diff coverage on all triggers.
  # ------------------------------------------------------------------
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve scan base ref
        id: scan-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "ref=$(git rev-parse --verify HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: ${{ steps.scan-base.outputs.ref }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified
